name: Bug 报告
description: 按钮没出现 / 识别失败 / 其他异常
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请说明操作系统、OpenCode 版本、安装方式和复现步骤。
        日志和截图请移除密钥、个人配对脚本、私人录音与转写内容。
  - type: input
    id: os
    attributes:
      label: 系统
      placeholder: 例如 Windows 11 / macOS（请注明版本和 Intel 或 Apple Silicon）
    validations:
      required: true
  - type: input
    id: opencode
    attributes:
      label: OpenCode 版本和接入方式
      placeholder: 例如 1.18.35 / Windows Electron Desktop（About 对话框可查）
    validations:
      required: true
  - type: input
    id: voice_version
    attributes:
      label: Local Voice 版本和安装入口
      placeholder: 例如 V0.2.0 / windows/install.ps1
    validations:
      required: true
  - type: textarea
    id: desc
    attributes:
      label: 问题与复现步骤
      description: 说明操作步骤、预期结果和实际结果；可以附已脱敏的截图。
    validations:
      required: true
  - type: textarea
    id: miclog
    attributes:
      label: 错误信息（可选）
      description: "界面错误或浏览器控制台日志，请移除凭据与私人内容。"
      render: text
  - type: textarea
    id: sttlog
    attributes:
      label: 识别信息（可选）
      description: "识别失败或速度问题可附模型、设备和 service.log 的相关片段；请先脱敏。"
      render: text
