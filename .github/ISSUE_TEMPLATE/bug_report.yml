name: Bug 报告
description: 按钮没出现 / 识别失败 / 其他异常
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请附环境、接入方式、实际 backend/device/model 和复现步骤。
        日志请脱敏；不要上传 token、个人配对脚本、业务录音或转写内容。
  - type: input
    id: os
    attributes:
      label: 系统
      placeholder: 例如 Windows 11 23H2 / macOS 15 (Apple Silicon)
    validations:
      required: true
  - type: input
    id: opencode
    attributes:
      label: OpenCode 版本和接入方式
      placeholder: 例如 1.18.35 / Windows Electron Desktop（About 对话框可查）
    validations:
      required: true
  - type: input
    id: voice_version
    attributes:
      label: Local Voice 版本和安装入口
      placeholder: 例如 V0.2.0 / install.ps1 / 开始菜单维护入口
    validations:
      required: true
  - type: textarea
    id: desc
    attributes:
      label: 问题描述
      description: 发生了什么？你预期是什么？复现步骤。
    validations:
      required: true
  - type: textarea
    id: miclog
    attributes:
      label: 渲染层日志
      description: "浏览器控制台或界面错误（脱敏，勿贴凭据）"
      render: text
  - type: textarea
    id: sttlog
    attributes:
      label: 识别服务日志
      description: "`~/.config/opencode/local-voice/service.log` 尾部；附模型、实际设备和冷/热耗时"
      render: text
