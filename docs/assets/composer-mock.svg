<svg xmlns="http://www.w3.org/2000/svg" width="880" height="176" viewBox="0 0 880 176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="174" rx="14" fill="#fbf7f7" stroke="#eadfdf" stroke-width="1.5"/>
  <text x="30" y="46" font-size="15" fill="#9a9191">随便问点什么， / 可查看命令， @ 可添加上下文…</text>

  <!-- cancel button -->
  <circle cx="44" cy="128" r="15" fill="#efe9e9"/>
  <path d="M38.5 122.5l11 11M49.5 122.5l-11 11" stroke="#6e6a6a" stroke-width="1.8" stroke-linecap="round"/>

  <!-- waveform: idle dots -->
  <line x1="76" y1="128" x2="540" y2="128" stroke="#cfc7c7" stroke-width="3.4" stroke-dasharray="0.1 8" stroke-linecap="round"/>

  <!-- waveform: voice activity bars -->
  <g fill="#a89e9e">
    <rect x="556" y="124" width="3" height="8" rx="1.5"/>
    <rect x="562.5" y="122" width="3" height="12" rx="1.5"/>
    <rect x="569" y="119" width="3" height="18" rx="1.5"/>
    <rect x="575.5" y="116" width="3" height="24" rx="1.5"/>
    <rect x="582" y="113" width="3" height="30" rx="1.5"/>
    <rect x="588.5" y="115" width="3" height="26" rx="1.5"/>
    <rect x="595" y="118" width="3" height="20" rx="1.5"/>
    <rect x="601.5" y="114" width="3" height="28" rx="1.5"/>
    <rect x="608" y="112" width="3" height="32" rx="1.5"/>
    <rect x="614.5" y="116" width="3" height="24" rx="1.5"/>
    <rect x="621" y="119" width="3" height="18" rx="1.5"/>
    <rect x="627.5" y="115" width="3" height="26" rx="1.5"/>
    <rect x="634" y="113" width="3" height="30" rx="1.5"/>
    <rect x="640.5" y="117" width="3" height="22" rx="1.5"/>
    <rect x="647" y="120" width="3" height="16" rx="1.5"/>
    <rect x="653.5" y="116" width="3" height="24" rx="1.5"/>
    <rect x="660" y="115" width="3" height="26" rx="1.5"/>
    <rect x="666.5" y="119" width="3" height="18" rx="1.5"/>
    <rect x="673" y="121" width="3" height="14" rx="1.5"/>
    <rect x="679.5" y="118" width="3" height="20" rx="1.5"/>
    <rect x="686" y="120" width="3" height="16" rx="1.5"/>
    <rect x="692.5" y="122" width="3" height="12" rx="1.5"/>
    <rect x="699" y="123.5" width="3" height="9" rx="1.5"/>
  </g>

  <!-- timer -->
  <text x="712" y="133" font-size="14" fill="#6e6a6a" letter-spacing="0.5">00:05</text>

  <!-- stop button -->
  <rect x="762" y="110" width="36" height="36" rx="9" fill="#e6dfdf"/>
  <rect x="775" y="123" width="10" height="10" rx="2" fill="#5f5959"/>

  <!-- send button (muted while recording) -->
  <rect x="810" y="110" width="36" height="36" rx="9" fill="#dcd4d4"/>
  <line x1="828" y1="139" x2="828" y2="121" stroke="#f7f3f3" stroke-width="2" stroke-linecap="round"/>
  <path d="M820 129L828 121L836 129" fill="none" stroke="#f7f3f3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
