[package]
name = "oc-voice-daemon"
version = "0.2.1"
edition = "2021"
description = "Zero-Python single-binary local voice daemon for OpenCode Desktop"
license = "MIT"

[dependencies]
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
